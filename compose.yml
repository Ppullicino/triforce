# Triforce in Docker. See DOCKER.md.
#
# TRIFORCE_TOKEN is read from a .env file in this directory (or the shell environment):
#   echo "TRIFORCE_TOKEN=$(openssl rand -hex 24)" >> .env

services:
  triforce:
    build: .
    image: triforce-local
    ports:
      - "3100:3000"
    # .env in this directory is picked up automatically. If TRIFORCE_TOKEN is unset
    # the server generates a one-time token and prints it to the log on startup.
    environment:
      PORT: "3000"
      NODE_ENV: production
      TRIFORCE_TOKEN: "${TRIFORCE_TOKEN:-}"
    volumes:
      # The project itself (server code, public/, models.config.json).
      - ./:/app
      # Reuse the host user's CLI logins so you authenticate once, on the host.
      # The container runs as uid 1000, matching the host user, so these are
      # read-write and token refreshes are shared.
      #   claude -> ~/.claude + ~/.claude.json
      #   codex  -> ~/.codex/auth.json
      #   agy    -> ~/.gemini/antigravity-cli/
      # Caveat: the container's claude/codex/agy then share live state with any
      # host Claude Code / Antigravity session (same files, same user). Fine for a
      # single operator; avoid heavy concurrent agy use on host + container.
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json
      - ${HOME}/.codex:/home/node/.codex
      - ${HOME}/.gemini:/home/node/.gemini
    restart: unless-stopped

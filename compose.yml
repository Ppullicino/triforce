# Triforce in Docker. See DOCKER.md.
#
# TRIFORCE_TOKEN is read from a .env file in this directory (or the shell environment):
#   echo "TRIFORCE_TOKEN=$(openssl rand -hex 24)" >> .env

services:
  triforce:
    build: .
    image: triforce-local
    ports:
      - "3100:3000"
    # .env in this directory is picked up automatically. If TRIFORCE_TOKEN is unset
    # the server generates a one-time token and prints it to the log on startup.
    environment:
      PORT: "3000"
      NODE_ENV: production
      TRIFORCE_TOKEN: "${TRIFORCE_TOKEN:-}"
    volumes:
      # The project itself (server code, public/, models.config.json).
      - ./:/app
      # Self-contained CLI credentials. Authenticate once inside the container
      # (see DOCKER.md); logins persist here across rebuilds and restarts, with
      # no dependency on the host user's ~/.claude, ~/.codex or ~/.gemini.
      # The three CLI binaries live in /usr/local, so this volume never shadows them.
      - triforce-home:/home/node
    restart: unless-stopped

volumes:
  triforce-home:
